<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1108" />
<title>星光阁楼 · 把一整个夜晚，都送给你</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- ============ 全屏 3D 舞台 ============ -->
<div class="stage" id="pane-scene">
  <canvas id="scene"></canvas>

  <!-- 浮动 HUD -->
  <div class="hud" id="hud">
    <div class="progress">
      <span class="dots" id="dots" aria-hidden="true"></span>
      <span class="progress-count" id="count">0&nbsp;/&nbsp;8</span>
    </div>
    <div class="actions">
      <button class="btn" id="btn-sound" type="button" aria-pressed="false">
        <span class="btn-ico">♪</span><span id="sound-label">声音</span>
      </button>
      <button class="btn" id="btn-reset" type="button" aria-label="回到初始视角">
        <span class="btn-ico">↺</span>
      </button>
    </div>
  </div>

  <div class="tooltip" id="tooltip"><b id="tooltip-name"></b><span>点我看看</span></div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-stripe"></div>
    <div class="toast-body">
      <b class="toast-name" id="toast-name"></b>
      <p class="toast-text" id="toast-text"></p>
    </div>
  </div>

  <div class="scene-hint" id="scene-hint">拖动旋转 · 滚轮缩放 · 点击物件</div>

  <div class="veil" id="veil"><span>正在点亮阁楼…</span></div>
</div>

<!-- ============ 终章 ============ -->
<div class="finale" id="finale" aria-hidden="true">
  <div class="finale-inner">
    <div class="finale-star">✦</div>
    <h2 class="finale-title">八颗小星星，<br />都被你点亮了。</h2>
    <p class="finale-text">今晚的灯不会灭，位置永远留着。<br />生日快乐。</p>
    <button class="btn btn-finale" id="btn-again" type="button">再看一遍</button>
  </div>
</div>

<script src="./vendor/three.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
